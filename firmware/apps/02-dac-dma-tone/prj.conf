# Timer-triggered DMA to the DAC.
#
# Zephyr's st,stm32-dac binding is single-value: it can set an output level, but
# it has no notion of a hardware trigger or a DMA stream. This application
# therefore drives the vendored STM32 HAL (Hardware Abstraction Layer) directly.
# The USE_STM32_HAL_* switches that pulls in are promptless, meaning they can only
# be turned on by another symbol selecting them, so they live in this
# application's Kconfig rather than here.

# sinf() for filling the lookup table
CONFIG_FPU=y

# Debug buffers in the board's non-cacheable region, as established by the
# previous application. Without this the control block lands in cached RAM and
# the probe reads stale bytes.
CONFIG_SEGGER_RTT_SECTION_CUSTOM_DTS_REGION=y

# Re-initialise the RTT control block every boot. The default mode inherits a
# stale-but-valid control block from the previous image; if its ring filled with
# no reader attached, new output is silently dropped and the debugger shows the
# old firmware's prints forever.
CONFIG_SEGGER_RTT_INIT_MODE_ALWAYS=y
