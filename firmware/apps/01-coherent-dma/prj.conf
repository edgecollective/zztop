# Place the debug transport's buffers in the board's non-cacheable devicetree
# region. This is the load-bearing line: without it the RTT control block lands in
# cached RAM and the debug probe reads stale bytes.
#
# The data cache stays ON. Proving coherency with the cache enabled is the entire
# point of this application; disabling it would work and would prove nothing.
CONFIG_GPIO=y
CONFIG_SEGGER_RTT_SECTION_CUSTOM_DTS_REGION=y

# Re-initialise the RTT control block on every boot. The default mode keeps a
# stale-but-structurally-valid control block from whatever image ran previously.
# If that image's ring buffer filled with no reader attached, every new print is
# silently discarded and the debugger keeps showing the old firmware's output.
CONFIG_SEGGER_RTT_INIT_MODE_ALWAYS=y
