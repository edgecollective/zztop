# Zephyr's st,stm32-dac binding is single-value, with no hardware trigger or DMA
# support, so this application drives the vendored STM32 HAL directly. The
# USE_STM32_HAL_* switches that requires are promptless and are selected by this
# application's Kconfig file.

# sinf() for filling the lookup table
CONFIG_FPU=y

# Debug buffers in the board's non-cacheable region. Without this the control block
# lands in cached RAM and the debug probe reads stale bytes.
CONFIG_SEGGER_RTT_SECTION_CUSTOM_DTS_REGION=y

# Re-initialise the RTT control block every boot. The default mode inherits a
# stale-but-valid control block from the previous image; if its ring filled with no
# reader attached, new output is silently dropped and the debugger shows the old
# firmware's prints forever.
CONFIG_SEGGER_RTT_INIT_MODE_ALWAYS=y
